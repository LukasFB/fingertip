<!doctype html><html><head><meta charset="utf-8"><script src="sdpi-components.js"></script><style>body{font:13px system-ui;color:#ddd;background:#2d2d2d;padding:12px}select{margin-left:12px}p{line-height:1.5;color:#aaa}</style></head><body><label>App <select id="backend"><option value="codex">Codex / ChatGPT</option><option value="t3">T3 Code</option></select></label><p>For T3 Code, connect once from a Task or Model key. Fast Mode applies to the most recently visited thread. Providers without Fast Mode show an unknown state.</p><script>const select=document.querySelector('#backend'); FingertipPI.onSettings(settings=>{select.value=settings.backend||'codex'});select.addEventListener('change',()=>FingertipPI.setSetting('backend',select.value));</script></body></html>
