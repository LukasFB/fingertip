<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fingertip Fast Mode</title><script src="sdpi-components.js"></script>
  <style>
    :root{color-scheme:dark;font:13px -apple-system,BlinkMacSystemFont,sans-serif}body{margin:0;padding:12px;color:#f7f7f7;background:#292929}.item{display:grid;grid-template-columns:94px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:14px}label{color:#d4d4d4;text-align:right}.helper{color:#aaa;font-size:11px;line-height:1.4}#preview{width:92px;height:92px;border-radius:12px;background:#0b0d10;box-shadow:0 0 20px rgba(156,213,254,.18)}#mode{font-weight:650}#connection{color:#aaa;font-size:11px}
  </style>
</head>
<body>
  <div class="item"><label>Preview</label><div><img id="preview" alt="Fast Mode key preview"><div id="mode">Unknown</div><div id="connection">Connecting…</div></div></div>
  <div class="helper">Toggles Fast Mode in the currently visible ChatGPT composer. A hollow bolt means Standard; a filled yellow-orange electric bolt means Fast. There is no per-key Task assignment.</div>
  <script>
    const preview=document.querySelector("#preview"),mode=document.querySelector("#mode"),connection=document.querySelector("#connection");
    FingertipPI.onState((state)=>{if(!state||state.type!=="fingertip-fast-mode-state")return;preview.src=state.preview;mode.textContent=state.fastMode==="fast"?"Fast":state.fastMode==="standard"?"Standard":state.hasActiveComposer?"Unknown":"No active composer";connection.textContent=state.connection?.label||"Connecting…"});
  </script>
</body>
</html>
